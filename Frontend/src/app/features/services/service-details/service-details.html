<!-- Loading -->
<div class="container py-5 text-center" *ngIf="loading">

  <div class="spinner-border text-danger"></div>

  <p class="mt-3">Loading service details...</p>

</div>

<!-- Error -->
<div class="container py-5 text-center" *ngIf="errorMessage && !loading">

  <h2>Service Not Found</h2>

  <p>{{ errorMessage }}</p>

  <a routerLink="/services" class="btn btn-outline-secondary">
    Back to Services
  </a>

</div>

<!-- Service Details -->
<div class="container py-5" *ngIf="service && !loading">

  <div class="row align-items-center">

    <div class="col-lg-6">

      <img
        [src]="service.image || 'assets/images/default-service.jpg'"
        [alt]="service.name"
        class="details-image">

    </div>

    <div class="col-lg-6 details-content">

      <span>{{ service.category }}</span>

      <h1>{{ service.name }}</h1>

      <p>{{ service.description }}</p>

      <h2>₹{{ service.price }}</h2>

      <p>
        Duration: {{ service.duration }} minutes
      </p>

      <h4>Service Benefits</h4>

      <ul>
        <li *ngFor="let benefit of service.benefits || []">
          {{ benefit }}
        </li>
      </ul>

      <a
        [routerLink]="['/booking', service._id]"
        class="btn booking-btn">

        Book Appointment

      </a>

    </div>

  </div>

</div>
