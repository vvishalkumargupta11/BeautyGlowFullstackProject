<div class="container py-5" *ngIf="service; else notFound">

  <div class="row align-items-center">

    <div class="col-lg-6">

      <img
        [src]="service.image"
        [alt]="service.name"
        class="details-image">

    </div>

    <div class="col-lg-6 details-content">

      <span>{{ service.category }}</span>

      <h1>{{ service.name }}</h1>

      <p>{{ service.description }}</p>

      <h2>₹{{ service.price }}</h2>

      <p>
        Duration: {{ service.duration }} minutes
      </p>

      <h4>Service Benefits</h4>

      <ul>

        <li *ngFor="let benefit of service.benefits">
          {{ benefit }}
        </li>

      </ul>

      <a
        [routerLink]="['/booking', service.id]"
        class="btn booking-btn">

        Book Appointment

      </a>

    </div>

  </div>

</div>

<ng-template #notFound>

  <div class="container py-5 text-center">
    <h2>Service Not Found</h2>
    <a routerLink="/services">Back to Services</a>
  </div>

</ng-template>
