<section class="contact-banner text-center">

  <h1>Contact Us</h1>

  <p>We would love to hear from you.</p>

</section>

<section class="container py-5">

  <div class="row">

    <div class="col-lg-5">

      <h2>Get In Touch</h2>

      <p>Phone: +91 9876543210</p>

      <p>Email: info@beautyglow.in</p>

      <p>Location: Pune, Maharashtra</p>

      <p>Working Hours: 10 AM - 8 PM</p>

    </div>

    <div class="col-lg-7">

      <h3>Send Us a Message</h3>

      <form>

        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Your Name">
        </div>

        <div class="mb-3">
          <input
            type="email"
            class="form-control"
            placeholder="Your Email">
        </div>

        <div class="mb-3">
          <input
            type="tel"
            class="form-control"
            placeholder="Mobile Number">
        </div>

        <div class="mb-3">
          <textarea
            class="form-control"
            rows="5"
            placeholder="Your Message">
          </textarea>
        </div>

        <button type="button" class="btn contact-btn">
          Send Message
        </button>

      </form>

    </div>

  </div>

</section>
