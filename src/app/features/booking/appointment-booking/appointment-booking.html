<div class="booking-page">

  <div class="container py-5">

    <div class="text-center mb-5">

      <span>BEAUTYGLOW</span>

      <h1>Book Your Appointment</h1>

      <p>Complete your details to schedule your beauty session.</p>

    </div>


    <div class="row justify-content-center">

      <div class="col-lg-7">

        <div class="booking-card" *ngIf="service; else notFound">

          <h3>Selected Service</h3>

          <div class="selected-service">

            <div>

              <h4>{{ service.name }}</h4>

              <p>{{ service.duration }} Minutes</p>

            </div>

            <h3>₹{{ service.price }}</h3>

          </div>


          <form (ngSubmit)="bookAppointment()" #bookingForm="ngForm">

            <h4>Customer Information</h4>

            <div class="mb-3">

              <label>Full Name</label>

              <input
                type="text"
                class="form-control"
                name="customerName"
                [(ngModel)]="customerName"
                required>

            </div>


            <div class="mb-3">

              <label>Email Address</label>

              <input
                type="email"
                class="form-control"
                name="email"
                [(ngModel)]="email"
                required
                email>

            </div>


            <div class="mb-4">

              <label>Mobile Number</label>

              <input
                type="tel"
                class="form-control"
                name="mobile"
                [(ngModel)]="mobile"
                required
                pattern="[0-9]{10}"
                maxlength="10">

            </div>


            <h4>Appointment Details</h4>

            <div class="mb-4">

              <label>Select Date</label>

              <input
                type="date"
                class="form-control"
                name="appointmentDate"
                [min]="minimumDate"
                [(ngModel)]="appointmentDate"
                required>

            </div>


            <label>Select Time Slot</label>

            <div class="time-slots">

              <button
                type="button"
                *ngFor="let time of availableTimes"
                [class.active]="selectedTime === time"
                (click)="selectedTime = time">

                {{ time }}

              </button>

            </div>


            <button
              type="submit"
              class="btn confirm-btn"
              [disabled]="!bookingForm.valid || !selectedTime">

              Confirm Booking

            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>

<ng-template #notFound>

  <div class="text-center py-5">
    <h3>Service Not Found</h3>
  </div>

</ng-template>
