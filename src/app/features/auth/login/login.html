<div class="auth-container">

  <div class="auth-card">

    <div class="text-center mb-4">
      <h2>BeautyGlow</h2>
      <p>Welcome back! Please login.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submit()">

      <div class="mb-3">
        <label>Email Address</label>
        <input type="email"
          class="form-control"
          formControlName="email"
          placeholder="Enter your email">

        <small class="text-danger"
          *ngIf="loginForm.controls.email.touched &&
          loginForm.controls.email.invalid">
          <span *ngIf="loginForm.controls.email.errors?.['required']">
            Email address is required.
          </span>
          <span *ngIf="loginForm.controls.email.errors?.['email']">
            Enter a valid email address.
          </span>
        </small>
      </div>

      <div class="mb-3">
        <label>Password</label>
        <input type="password"
          class="form-control"
          formControlName="password"
          placeholder="Enter password">
        <small class="text-danger"
          *ngIf="loginForm.controls.password.touched &&
          loginForm.controls.password.invalid">
          <span *ngIf="loginForm.controls.password.errors?.['required']">
            Password is required.
          </span>
          <span *ngIf="loginForm.controls.password.errors?.['minlength']">
            Password must be at least 8 characters.
          </span>
        </small>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button class="btn btn-login w-100"
        type="submit"
        [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <div class="text-center mt-3">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </div>

  </div>

</div>
